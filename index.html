<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1D46C8" />
    <script>
      // Aplica el tema guardado antes de pintar (sin parpadeo). Ver src/lib/tema.ts.
      try {
        var p = localStorage.getItem('padelito:tema')
        var n = p === 'noche' || (p === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (n) {
          document.documentElement.dataset.tema = 'noche'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B1A4A')
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Agenda, alumnos y seguimiento para profes de pádel." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Padelito" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Padelito</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
